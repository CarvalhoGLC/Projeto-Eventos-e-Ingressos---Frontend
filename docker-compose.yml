services:
  frontend:
    build:
      context: .
      args:
        # Lido do .env na raiz deste projeto (mesma pasta do compose).
        # Precisa ser a URL do backend acessível a partir do NAVEGADOR do
        # usuário final — não a URL interna de outro container.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "5173:80"