server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (mesmo papel do rewrite que já existe no vercel.json). Sem isso,
    # dar refresh em /client, /gate etc. retorna 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para os assets com hash no nome (gerados pelo Vite) —
    # são imutáveis por definição, um novo build gera um novo hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}